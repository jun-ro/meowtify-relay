[package]
name = "meowtify-jam-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "The jam signaling relay as a Cloudflare Worker with one Durable Object per room."

# Its own workspace: it builds for wasm32 only and must not join the app's workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3.107"
meowtify-jam = { path = "../crates/meowtify-jam" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
worker = "0.8.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
