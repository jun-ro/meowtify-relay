# Put these two blocks inside your `server { ... }` that already has TLS for jam.example.com.
# Run the relay on loopback: meowtify-jam-relay 127.0.0.1:8787

# ICE servers for the app. A short plain request.
location = /turn {
    access_log off;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
}

# The WebSocket for a room. The access log is off so nothing records who joins a jam.
location /jam/ {
    access_log off;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
